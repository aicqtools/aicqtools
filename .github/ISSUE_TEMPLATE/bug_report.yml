name: 🐛 Bug report
description: 동작 오류·예상치 못한 결과 신고 / Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        먼저 [기존 이슈](https://github.com/aicqtools/aicqtools/issues?q=is%3Aissue)를 검색해 중복인지 확인해 주세요.
        Please search [existing issues](https://github.com/aicqtools/aicqtools/issues?q=is%3Aissue) first to avoid duplicates.

  - type: input
    id: aicq-version
    attributes:
      label: aicq 버전 / version
      description: "`aicq --version` 또는 package.json의 version"
      placeholder: "1.0.0-beta.2"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 버전 / version
      placeholder: "20.10.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 운영체제 / OS
      options:
        - Windows
        - macOS
        - Linux (Ubuntu/Debian/etc.)
        - WSL2
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 단계 / Reproduction steps
      description: 가능한 한 최소 재현 가능한 예제를 제공해 주세요. / Please provide a minimal reproducible example.
      placeholder: |
        1. `pnpm add -D @aicqtools/cli`
        2. `aicq.config.yaml`에 ... 작성
        3. `aicq check` 실행
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작 / Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작 + 에러 메시지 / Actual behavior + error
      description: 가능하면 전체 stderr 출력 첨부. / Include full stderr if possible.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 추가 컨텍스트 / Additional context
      description: 룰 ID, 관련 코드 스니펫, 스크린샷 등. / Rule IDs, related code snippets, screenshots.
