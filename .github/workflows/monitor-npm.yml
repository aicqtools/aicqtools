name: Monitor — npm weekly downloads (G2 gate)

# G2 게이트(npm weekly downloads ≥ 200) 추적용 cron 워크플로.
# 매주 월요일 09:00 KST = UTC 00:00 에 npm-stat API를 호출해
# `@aicqtools/cli`의 최근 1주 다운로드 수를 측정하고 GitHub Issue로 보고합니다.
# `workflow_dispatch`로 수동 트리거도 가능.

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch npm weekly downloads
        id: fetch
        run: |
          DATA=$(curl -fsS "https://api.npmjs.org/downloads/point/last-week/@aicqtools/cli")
          echo "downloads=$(echo "$DATA" | jq -r '.downloads')" >> "$GITHUB_OUTPUT"
          echo "start=$(echo "$DATA" | jq -r '.start')" >> "$GITHUB_OUTPUT"
          echo "end=$(echo "$DATA" | jq -r '.end')" >> "$GITHUB_OUTPUT"

      - name: Determine G2 gate status
        id: gate
        run: |
          DL=${{ steps.fetch.outputs.downloads }}
          if [ "$DL" -ge 200 ]; then
            echo "status=:white_check_mark: MET" >> "$GITHUB_OUTPUT"
          else
            echo "status=:hourglass: pending ($DL / 200)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create monitoring issue
        uses: actions/github-script@v7
        with:
          script: |
            const downloads = '${{ steps.fetch.outputs.downloads }}';
            const start = '${{ steps.fetch.outputs.start }}';
            const end = '${{ steps.fetch.outputs.end }}';
            const gate = '${{ steps.gate.outputs.status }}';

            const title = `[monitoring] npm weekly downloads — ${start} ~ ${end}`;
            const body = [
              '## G2 Gate — `@aicqtools/cli` weekly downloads',
              '',
              `- **Period:** ${start} ~ ${end}`,
              `- **Downloads:** ${downloads}`,
              '- **G2 threshold:** ≥ 200 / week',
              `- **Status:** ${gate}`,
              '',
              '---',
              '',
              '_Auto-generated by `.github/workflows/monitor-npm.yml`._ ',
              '_Close after triage. See [`docs/policy/issue-triage.md`](../docs/policy/issue-triage.md) for label conventions._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['monitoring:weekly']
            });
